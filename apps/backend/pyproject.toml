[project]
name = "bitcoin-intel-backend"
version = "0.1.0"
description = "FastAPI backend for the SIH 26146 Bitcoin Intelligence Platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "duckdb>=1.4,<2",
    "fastapi>=0.116,<1",
    "neo4j>=6.2,<6.3",
    "polars>=1.33,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyarrow>=20,<24",
    "pytz>=2025.2,<2027",
    "tzdata>=2025.2,<2027",
    "uvicorn[standard]>=0.35,<1",
    "igraph>=0.11,<2",
    "joblib>=1.5,<2",
    "maxminddb>=3.1,<4",
    "scikit-learn>=1.7,<2",
    "xgboost-cpu>=3.4,<3.5",
    "lightgbm>=4.7,<4.8",
]

[project.scripts]
bitcoin-intel = "bitcoin_intel.ingestion.cli:main"
bitcoin-intel-api = "bitcoin_intel.main:run"

[dependency-groups]
dev = [
    "hypothesis>=6.138,<7",
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "mmdb-writer>=0.2,<0.3",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "types-defusedxml>=0.7.0,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitcoin_intel"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the explicitly configured Dockerized Neo4j test database",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "igraph",
    "joblib",
    "maxminddb",
    "maxminddb.*",
    "mmdb_writer",
    "netaddr",
    "pyarrow",
    "pyarrow.*",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true
